name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew # If you have a gradlew wrapper, otherwise use gradle command
        continue-on-error: true
        
      - name: Build
        run: ./gradlew meowJar # This task is defined in your build.gradle
        # Note: If you don't have a gradlew wrapper in the zip, 
        # you might need to install gradle first or add a wrapper step.
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meow-client-liquid
          path: build/libs/meow-client-liquid.jar
